script:
  - [TEXT, "It was Richter Belmont,"]
  - [LINE_BREAK, 13]
  - [TEXT, "the legendary vampire hunter,"]
  - [LINE_BREAK, 8]
  - [TEXT, "who succeeded in finally ending"]
  - [LINE_BREAK, 13]
  - [TEXT, "the menace of Count Dracula,"]
  - [LINE_BREAK, 8]
  - [TEXT, "Lord of the Vampires who had been"]
  - [LINE_BREAK, 12]
  - [TEXT, "brought back from the grave by"]
  - [LINE_BREAK, 23]
  - [TEXT, "the dark priest Shaft."]
  - [PARAGRAPH_BREAK, 8]
  - [TEXT, "However, one night 4 years later,"]
  - [LINE_BREAK, 12]
  - [TEXT, "under the glare of a full moon,"]
  - [LINE_BREAK, 11]
  - [TEXT, "Richter mysteriously vanished."]
  - [PARAGRAPH_BREAK, 12]
  - [TEXT, "With no idea of where to begin"]
  - [LINE_BREAK, 20]
  - [TEXT, "her search, Maria Renard"]
  - [LINE_BREAK, 22]
  - [TEXT, "set out to look for him."]
  - [LINE_BREAK, 8]
  - [TEXT, "It was then that fate intervened."]
  - [PARAGRAPH_BREAK, 5]
  - [TEXT, "Castlevania, the castle of Dracula,"]
  - [LINE_BREAK, 10]
  - [TEXT, "which is rumored to appear once"]
  - [LINE_BREAK, 21]
  - [TEXT, "every century, suddenly"]
  - [LINE_BREAK, 7]
  - [TEXT, "materialized from out of the mist"]
  - [LINE_BREAK, 19]
  - [TEXT, "as if to show her the way."]
  - [PARAGRAPH_BREAK, 9]
  - [TEXT, "Meanwhile, powerful forces were"]
  - [LINE_BREAK, 17]
  - [TEXT, "struggling for the soul of"]
  - [LINE_BREAK, 27]
  - [TEXT, "a man named Alucard."]
  - [LINE_BREAK, 13]
  - [TEXT, "The very same Alucard who had"]
  - [LINE_BREAK, 9]
  - [TEXT, "teamed up with Trevor Belmont to"]
  - [LINE_BREAK, 16]
  - [TEXT, "battle his immortal father,"]
  - [LINE_BREAK, 19]
  - [TEXT, "Count Vlad Tepes Dracula."]
  - [PARAGRAPH_BREAK, 3]
  - [TEXT, "Alucard, in order to purge the world"]
  - [LINE_BREAK, 14]
  - [TEXT, "of his own cursed blood line,"]
  - [LINE_BREAK, 7]
  - [TEXT, "had submerged his vampiric powers"]
  - [LINE_BREAK, 6]
  - [TEXT, "and entered into what was supposed"]
  - [LINE_BREAK, 20]
  - [TEXT, "to be an eternal slumber."]
  - [LINE_BREAK, 8]
  - [TEXT, "But now, he is awake and aware of"]
  - [LINE_BREAK, 16]
  - [TEXT, "the evil once again at work"]
  - [LINE_BREAK, 32]
  - [TEXT, "in his homeland."]
  - [PARAGRAPH_BREAK, 9]
  - [TEXT, "The time has once again come for"]
  - [LINE_BREAK, 12]
  - [TEXT, "the forces of Good and Evil to"]
  - [LINE_BREAK, 11]
  - [TEXT, "engage in their ancient battle."]
  - [LINE_BREAK, 5]
  - [TEXT, "Dracula's castle beckons for you..."]
  - [PARAGRAPH_BREAK, 15]
  - [TEXT, "And no man can say who shall"]
  - [LINE_BREAK, 29]
  - [TEXT, "emerge victorious."]
  - [END]
