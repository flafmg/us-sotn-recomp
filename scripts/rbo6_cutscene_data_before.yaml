  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [TEXT, "I was hoping "]
  - [SET_SPEED, 1]
  - [TEXT, "we"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "would not see each"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "other again. "]
  - [SET_WAIT, 32]
