  - [SET_WAIT, 28]
  - [TEXT, "No. "]
  - [SET_WAIT, 36]
  - [SET_SPEED, 2]
  - [TEXT, "But neither do"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "I seek revenge"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
