  - [SET_WAIT, 24]
  - [SET_SPEED, 2]
  - [TEXT, "No"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "matter. "]
  - [SET_WAIT, 32]
  - [SET_SPEED, 3]
  - [TEXT, "Now is the"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "time to put aside"]
  - [LINE_BREAK]
  - [SET_WAIT, 16]
  - [TEXT, "your weak "]
  - [SET_SPEED, 4]
  - [TEXT, "human side"]
  - [LINE_BREAK]
  - [SET_WAIT, 24]
  - [TEXT, "and join me "]
  - [SET_WAIT, 16]
  - [TEXT, "in"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
