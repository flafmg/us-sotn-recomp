  - [TEXT, "the ally of humans."]
  - [LINE_BREAK]
  - [SET_WAIT, 44]
  - [SET_SPEED, 2]
  - [TEXT, "Have you forgotten"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
