  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x35b]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [TEXT, "Perhaps the same"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "could be said"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "of"]
  - [SET_SPEED, 3]
