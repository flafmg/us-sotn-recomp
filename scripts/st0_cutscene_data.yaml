  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 4]
  - [TEXT, "Die monster."]
  - [LINE_BREAK]
  - [SET_WAIT, 28]
  - [SET_SPEED, 2]
  - [TEXT, "You don't belong"]
  - [LINE_BREAK]
  - [SET_WAIT, 8]
  - [TEXT, "in this world!"]
