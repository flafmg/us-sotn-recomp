  - [WAIT_FOR_SOUND]
  - [SET_FLAG, 10]
  - [SET_SPEED, 4]
  - [TEXT, "Tribute!?!"]
  - [LINE_BREAK]
  - [SET_WAIT, 32]
  - [SET_FLAG, 11]
  - [SET_SPEED, 4]
  - [TEXT, "You steal men's"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "souls "]
  - [SET_WAIT, 12]
  - [SET_FLAG, 12]
  - [SET_SPEED, 2]
  - [TEXT, "and make them"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [SET_FLAG, 13]
