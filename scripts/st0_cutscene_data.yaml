  - [LINE_BREAK]
  - [SET_WAIT, 40]
  - [SET_SPEED, 2]
  - [WAIT_FOR_FLAG, 8]
  - [TEXT, "But enough "]
  - [SET_FLAG, 6]
  - [TEXT, "talk..."]
  - [LINE_BREAK]
  - [SET_WAIT, 24]
  - [TEXT, "Have at you!"]
  - [SET_WAIT, 48]
