  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 3]
  - [TEXT, "It was not by my"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "hand that I am once"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "again given flesh."]
  - [LINE_BREAK]
  - [SET_WAIT, 48]
  - [TEXT, "I was called here"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "by "]
  - [SET_WAIT, 16]
  - [SET_SPEED, 5]
  - [TEXT, "humans "]
  - [SET_WAIT, 16]
  - [SET_SPEED, 3]
  - [TEXT, "who"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "wish to pay me"]
  - [LINE_BREAK]
  - [SET_WAIT, 24]
  - [TEXT, "tribute."]
