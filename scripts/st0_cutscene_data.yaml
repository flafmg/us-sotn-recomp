  - [SET_PORTRAIT, 0, 0]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x35c]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 3]
  - [SET_FLAG, 14]
  - [TEXT, "Your words are as"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [SET_FLAG, 15]
  - [TEXT, "empty as your soul!"]
  - [LINE_BREAK]
  - [SET_WAIT, 40]
  - [SET_FLAG, 16]
  - [TEXT, "Mankind ill needs a"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [SET_FLAG, 4]
  - [SET_FLAG, 17]
  - [SET_SPEED, 4]
  - [TEXT, "savior such as you!"]
  - [SET_WAIT, 48]
  - [SET_FLAG, 18]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 1, 129]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x35d]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 3]
  - [TEXT, "What is a man?"]
  - [LINE_BREAK]
  - [SET_WAIT, 16]
  - [SET_FLAG, 5]
  - [SET_WAIT, 32]
  - [SET_SPEED, 3]
  - [TEXT, "A miserable little"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
